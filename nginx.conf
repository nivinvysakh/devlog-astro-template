server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets & Images Long-Term Cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Pagefind Static Search Index Cache
    location ^~ /pagefind/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Clean URLs & Custom 404 Redirection
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Custom 404 Page Definition
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
